name: Deploy Shopify Proxy
on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Verify index.html exists
        run: |
          if [ ! -f index.html ]; then
            echo "ERROR: index.html not found in repo root!"
            exit 1
          fi

      - name: Inject Shopify Secrets
        env:
          SHOPIFY_PROXY_SECRET: ${{ secrets.SHOPIFY_PROXY_SECRET }}
          SHOPIFY_API_KEY: ${{ secrets.SHOPIFY_API_KEY }}
        run: |
          echo "Starting secret injection..."
          if [ -z "$SHOPIFY_PROXY_SECRET" ] || [ -z "$SHOPIFY_API_KEY" ]; then
            echo "ERROR: One or both secrets are missing!"
            exit 1
          fi

          # Escape for sed: replace /, &, \ with \/
          ESCAPED_SECRET=$(printf '%s' "$SHOPIFY_PROXY_SECRET" | sed 's/[\/&]/\\&/g')
          ESCAPED_KEY=$(printf '%s' "$SHOPIFY_API_KEY" | sed 's/[\/&]/\\&/g')

          sed -i "s|%%SHOPIFY_PROXY_SECRET%%|$ESCAPED_SECRET|g" index.html
          sed -i "s|%%SHOPIFY_API_KEY%%|$ESCAPED_KEY|g" index.html

          echo "Secrets injected."

      - name: Debug - Show final index.html
        run: |
          echo "=== FINAL index.html CONTENT ==="
          cat index.html
          echo "=== END OF FILE ==="

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: .
          force_orphan: true
