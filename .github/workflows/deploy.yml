name: Deploy Shopify Proxy
on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Verify index.html exists
        run: |
          if [ ! -f index.html ]; then
            echo "ERROR: index.html not found in repo root!"
            exit 1
          fi

      - name: Inject Shopify Secrets
        env:
          SHOPIFY_PROXY_SECRET: ${{ secrets.SHOPIFY_PROXY_SECRET }}
          SHOPIFY_API_KEY:      ${{ secrets.SHOPIFY_API_KEY }}
        run: |
          echo "Injecting secrets into index.html..."
          if [ -z "$SHOPIFY_PROXY_SECRET" ] || [ -z "$SHOPIFY_API_KEY" ]; then
            echo "ERROR: One or both secrets are missing!"
            exit 1
          fi
          sed -i "s|%%SHOPIFY_PROXY_SECRET%%|$SHOPIFY_PROXY_SECRET|g" index.html
          sed -i "s|%%SHOPIFY_API_KEY%%|$SHOPIFY_API_KEY|g" index.html
          echo "Secrets injected."

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: .
          force_orphan: true
