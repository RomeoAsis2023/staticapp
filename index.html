<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Custom Text Field App</title>
  <link rel="stylesheet" href="style.css" />
  <script src="https://cdn.shopify.com/s/assets/external/app.js"></script>
</head>
<body>
 <button onclick="fetchProducts()">Fetch Products</button>
    
    <div id="products"></div>

    <script>
        async function fetchProducts() {
            const shop = 'https://d2cdesigntestromeo.myshopify.com';
            const clientId = '%%SHOPIFY_API_KEY%%';
            const clientSecret = '%%SHOPIFY_PROXY_SECRET%%';
            const apiVersion = '2025-10';

        
            // Basic Auth credentials
            const credentials = btoa(`${clientId}:${clientSecret}`);
            
            // REST API endpoint for products (simpler for plain JS; GraphQL would require POST body)
            const url = `https://${shop}/admin/api/${apiVersion}/products.json?limit=5`; // Limit to 5 for demo

            try {
                const response = await fetch(url, {
                    method: 'GET',
                    headers: {
                        'Authorization': `Basic ${credentials}`,
                        'Content-Type': 'application/json'
                    }
                });

                if (!response.ok) {
                    throw new Error(`HTTP error! status: ${response.status}`);
                }

                const data = await response.json();
                displayProducts(data.products);
            } catch (error) {
                console.error('Error fetching products:', error);
                document.getElementById('products').innerHTML = `<p>Error: ${error.message}</p>`;
            }
        }

        function displayProducts(products) {
            const container = document.getElementById('products');
            if (products.length === 0) {
                container.innerHTML = '<p>No products found.</p>';
                return;
            }

            container.innerHTML = `<h2>Products (${products.length}):</h2>`;
            products.forEach(product => {
                const div = document.createElement('div');
                div.className = 'product';
                div.innerHTML = `
                    <h3>${product.title}</h3>
                    <p>ID: ${product.id}</p>
                    <p>Handle: ${product.handle}</p>
                    <p>Price: $${product.variants[0]?.price || 'N/A'}</p>
                    <img src="${product.images[0]?.src || ''}" alt="${product.title}" style="max-width: 200px;" onerror="this.style.display='none';">
                `;
                container.appendChild(div);
            });
        }
    </script>
</body>
</html>
