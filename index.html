<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Shop Origin + Products</title>
  <script src="https://cdn.shopify.com/s/assets/external/app.js"></script>
  <style>
    body{font-family:system-ui,sans-serif;background:#f6f6f6;padding:2rem;}
    .box{background:#fff;padding:1.5rem;border-radius:8px;box-shadow:0 2px 8px rgba(0,0,0,.1);max-width:600px;margin:auto;}
    code{background:#eee;padding:2px 6px;border-radius:4px;}
    .product {border:1px solid #ddd;padding:10px;margin:10px 0;border-radius:6px;display:flex;align-items:center;}
    .product img {max-height:60px;margin-right:10px;border-radius:4px;}
    .loading {color:#777;text-align:center;margin:20px 0;}
    .error {color:#c00;text-align:center;margin:20px 0;}
  </style>
</head>
<body>

<div class="box" id="output">Loading…</div>

<script>
  const params = new URLSearchParams(location.search);
  const shop = params.get('shop');
  const origin = shop ? (shop.startsWith('http') ? shop : `https://${shop}`) : null;
  
  if (!origin) {
    document.getElementById('output').innerHTML = '<p style="color:red;">Open from Shopify admin.</p>';
    throw new Error('No shop parameter');
  }

  // Initialize Shopify App
  ShopifyApp.init({
    apiKey: "ef270783ca1996cfb7dad3912f8355a6",
    shopOrigin: origin,
    forceRedirect: true
  });

  // Display shop info immediately
  document.getElementById('output').innerHTML = `
    <p><strong>Shop origin:</strong> <code>${origin}</code></p>
    <div id="products-container" class="loading">Loading products...</div>
  `;

  // Function to get products using Shopify Admin API
  async function getProducts() {
    try {
      console.log('Fetching products from:', `${origin}/admin/api/2024-01/products.json`);
      
      // Use Shopify's embedded app API to make authenticated requests
      const response = await ShopifyApp.makeApiCall({
        type: 'GET',
        url: '/admin/api/2024-01/products.json',
        dataType: 'json'
      });
      
      console.log('API response:', response);
      return response.data.products;
    } catch (error) {
      console.error('Error fetching products:', error);
      throw error;
    }
  }

  // Alternative method using fetch with session token
  async function getProductsWithToken() {
    try {
      // Get the session token
      const token = await ShopifyApp.getSessionToken();
      console.log('Session token obtained');
      
      const response = await fetch(`${origin}/admin/api/2024-01/products.json`, {
        headers: {
          'X-Shopify-Access-Token': token,
          'Content-Type': 'application/json'
        }
      });
      
      if (!response.ok) {
        throw new Error(`HTTP error! status: ${response.status}`);
      }
      
      const data = await response.json();
      return data.products;
    } catch (error) {
      console.error('Error with token method:', error);
      throw error;
    }
  }

  // Function to display products
  function displayProducts(products) {
    const container = document.getElementById('products-container');
    
    if (!products || products.length === 0) {
      container.innerHTML = '<div class="error">No products found</div>';
      return;
    }

    const productsHTML = products.map(product => `
      <div class="product">
        <img src="${product.images && product.images[0] ? product.images[0].src : 'https://via.placeholder.com/60'}" 
             alt="${product.title}">
        <div>
          <strong>${product.title}</strong><br>
          <small>Type: ${product.product_type || 'N/A'} | 
                 Vendor: ${product.vendor || 'N/A'} | 
                 Status: ${product.status}</small>
        </div>
      </div>
    `).join('');

    container.innerHTML = `
      <h3>Products (${products.length})</h3>
      ${productsHTML}
    `;
  }

  // Function to handle errors
  function displayError(error) {
    const container = document.getElementById('products-container');
    container.innerHTML = `
      <div class="error">
        <strong>Error loading products:</strong><br>
        ${error.message || 'Unknown error'}<br>
        <small>Check browser console for details</small>
      </div>
    `;
  }

  // Load products when the app is ready
  ShopifyApp.ready(() => {
    console.log('Shopify app ready, fetching products...');
    
    // Try the primary method first
    getProducts()
      .then(products => {
        console.log('Products loaded via makeApiCall:', products);
        displayProducts(products);
      })
      .catch(error => {
        console.log('Primary method failed, trying token method...', error);
        // Fallback to token method
        getProductsWithToken()
          .then(products => {
            console.log('Products loaded via token method:', products);
            displayProducts(products);
          })
          .catch(error => {
            console.error('Both methods failed:', error);
            displayError(error);
          });
      });
  });

  // Debug: Log available ShopifyApp methods
  ShopifyApp.ready(() => {
    console.log('Available ShopifyApp methods:', Object.keys(ShopifyApp));
  });
</script>
</body>
</html>
