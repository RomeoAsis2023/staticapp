<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Custom Text Field App</title>
  <link rel="stylesheet" href="style.css" />
  <script src="https://cdn.shopify.com/s/assets/external/app.js"></script>
</head>
<body>
  <h1>Shopify Products</h1>
    <div id="products-container" class="products-grid">
        <div class="loading">Loading products...</div>
    </div>

    <script>
        async function loadProducts() {
            const storeUrl = 'https://d2cdesigntestromeo.myshopify.com'; // Replace with actual store URL
            const container = document.getElementById('products-container');
            
            try {
                const response = await fetch(`${storeUrl}/products.json`);
                
                if (!response.ok) {
                    throw new Error(`Failed to load products: ${response.status}`);
                }
                
                const data = await response.json();
                
                if (data.products && data.products.length > 0) {
                    container.innerHTML = data.products.map(product => `
                        <div class="product-card">
                            <img src="${product.images[0]?.src || 'https://via.placeholder.com/250'}" 
                                 alt="${product.title}" 
                                 class="product-image">
                            <h3>${product.title}</h3>
                            <p>$${product.variants[0]?.price || 'Price unavailable'}</p>
                            <button onclick="viewProduct('${product.handle}')">View Details</button>
                        </div>
                    `).join('');
                } else {
                    container.innerHTML = '<div class="error">No products found</div>';
                }
                
            } catch (error) {
                container.innerHTML = `<div class="error">${error.message}</div>`;
            }
        }

        function viewProduct(handle) {
            window.open(`https://d2cdesigntestromeo.myshopify.com/products/${handle}`, '_blank');
        }

        // Load products when page loads
        loadProducts();
    </script>
</body>
</html>
