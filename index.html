<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Engraving Text App</title>

  <!-- Shopify App Bridge + Polaris -->
  <script src="https://unpkg.com/@shopify/app-bridge@3"></script>
  <script src="https://unpkg.com/@shopify/app-bridge-utils@3"></script>
  <script src="https://cdn.shopify.com/s/assets/external/app.js"></script>

  <!-- Polaris CSS -->
  <link
    rel="stylesheet"
    href="https://unpkg.com/@shopify/polaris@12/build/esm/styles.css"
  />

  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div id="app">
    <div class="Polaris-Page">
      <div class="Polaris-Page__Content">
        <div class="Polaris-Card" id="metafield-card">
          <div class="Polaris-Card__Header">
            <h2 class="Polaris-Heading">Engraving Text</h2>
          </div>
          <div class="Polaris-Card__Section">
            <div class="Polaris-FormLayout">
              <div class="Polaris-Labelled__Label">
                <label class="Polaris-Label">Text to engrave</label>
              </div>
              <input
                type="text"
                class="Polaris-TextField__Input"
                id="engraving-input"
                placeholder="Enter engraving text…"
              />
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
