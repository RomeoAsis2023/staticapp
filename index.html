<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Static App – Products</title>
  <style>
    body {font-family:Arial,sans-serif;margin:20px;}
    button{padding:10px 16px;font-size:16px;cursor:pointer;}
    .product{border:1px solid #ddd;margin:12px 0;padding:12px;border-radius:8px;}
    .product img{max-width:180px;margin-top:8px;}
    .error{color:red;font-weight:bold;}
    .loading{color:#555;}
  </style>

  <script src="https://cdn.shopify.com/s/assets/external/app.js"></script>
</head>
<body>

  <h1>Products from this store</h1>
  <button id="loadBtn">Load Products</button>
  <div id="output"></div>

  <script>
    // ——— CONFIG (replaced by GitHub Actions) ———
    const PROXY_URL      = 'https://shopify-proxy-romeoasis.meoasis2014.workers.dev';
    const API_VERSION    = '2025-10';
    const CLIENT_ID      = '%%SHOPIFY_API_KEY%%';        // <-- REPLACED
    const CLIENT_SECRET  = '%%SHOPIFY_PROXY_SECRET%%';   // <-- REPLACED
    const REDIRECT_URI   = 'https://romeoasis2023.github.io/staticapp/';
    // ————————————————————————————————

    const output = document.getElementById('output');
    const btn    = document.getElementById('loadBtn');

    function getShop() {
      const shop = new URLSearchParams(location.search).get('shop');
      return shop ? `https://${shop}` : null;
    }

    function startOAuth(shop) {
      if (!CLIENT_ID || CLIENT_ID.includes('%%')) {
        output.innerHTML = '<p class="error">Error: API key not loaded. Check GitHub Secrets & redeploy.</p>';
        return;
      }

      const url = `${shop}/admin/oauth/authorize?client_id=${CLIENT_ID}&scope=read_products&redirect_uri=${encodeURIComponent(REDIRECT_URI)}&state=staticapp`;

      if (window.top !== window.self) {
        window.top.location.href = url;
      } else {
        location.href = url;
      }
    }

    async function exchangeCode(shop, code) {
      const res = await fetch(`${shop}/admin/oauth/access_token`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ client_id: CLIENT_ID, client_secret: CLIENT_SECRET, code })
      });
      if (!res.ok) throw new Error(`Token failed: ${await res.text()}`);
      return (await res.json()).access_token;
    }

    async function loadProducts() {
      output.innerHTML = '<p class="loading">Loading...</p>';
      btn.disabled = true;

      try {
        const shop = getShop();
        if (!shop) throw new Error('Open from Shopify Admin.');

        const code = new URLSearchParams(location.search).get('code');

        if (!code) {
          startOAuth(shop);
          return;
        }

        const token = await exchangeCode(shop, code);
        const proxyUrl = `${PROXY_URL}/admin/api/${API_VERSION}/products.json?limit=10&shop=${encodeURIComponent(shop)}&token=${token}`;

        const res = await fetch(proxyUrl);
        if (!res.ok) throw new Error(`Proxy error: ${await res.text()}`);

        const { products } = await res.json();
        if (!products?.length) {
          output.innerHTML = '<p>No products found.</p>';
          return;
        }

        output.innerHTML = `<h2>${products.length} Products</h2>`;
        products.forEach(p => {
          const div = document.createElement('div');
          div.className = 'product';
          div.innerHTML = `
            <h3>${p.title}</h3>
            <p>ID: ${p.id} | Handle: ${p.handle}</p>
            <p>Price: $${p.variants[0]?.price || 'N/A'}</p>
            ${p.images[0]?.src ? `<img src="${p.images[0].src}" onerror="this.style.display='none'">` : ''}
          `;
          output.appendChild(div);
        });

      } catch (err) {
        output.innerHTML = `<p class="error">Error: ${err.message}</p>`;
      } finally {
        btn.disabled = false;
      }
    }

    btn.onclick = loadProducts;
    if (getShop()) loadProducts();
  </script>
</body>
</html>
