<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>StaticAppTest - Shopify Admin API Test</title>
  <meta name="shopify-api-key" content="ef270783ca1996cfb7dad3912f8355a6" />
  <script src="https://cdn.shopify.com/shopifycloud/app-bridge.js"></script>
  <script src="https://cdn.shopify.com/shopifycloud/polaris.js"></script>
</head>
<body>
  <button id="open-picker">Open resource picker</button>
  <button id="list-products" style="margin-left:10px;">List All Products</button>

  <div id="output" style="margin-top:20px; font-family: monospace; white-space: pre-wrap; max-height: 400px; overflow: auto; background:#f6f8fa; padding:1rem; border-radius:6px;"></div>

  <script>
    // === 1. YOUR ORIGINAL PICKER (100% unchanged) ===
    document.getElementById('open-picker').addEventListener('click', async () => {
      const selected = await shopify.resourcePicker({ type: 'product' });
      console.log(selected);
    });

    // === 2. LIST ALL PRODUCTS (uses Admin API) ===
    document.getElementById('list-products').addEventListener('click', async () => {
      const output = document.getElementById('output');
      output.textContent = 'Loading products...';

      try {
        const token = await shopify.getSessionToken();
        const res = await fetch('/admin/api/2025-01/products.json', {
          headers: { 'X-Shopify-Access-Token': token }
        });
        const { products } = await res.json();
        if (!products?.length) {
          output.textContent = 'No products found.';
          return;
        }
        output.textContent = products.map(p => `${p.title} (ID: ${p.id})`).join('\n');
      } catch (err) {
        output.textContent = 'Error: ' + err.message;
      }
    });

    // === 3. DYNAMIC SCOPE REQUEST (only if needed) ===
    (async () => {
      if (!window.shopify?.scopes) return;

      const requiredScopes = [
        'read_products', 'write_products',
        'read_metaobject_definitions', 'write_metaobject_definitions',
        'read_metaobjects', 'write_metaobjects',
        'read_product_feeds', 'write_product_feeds'
      ];

      try {
        const { granted } = await shopify.scopes.query();
        const missing = requiredScopes.filter(s => !granted.includes(s));

        if (missing.length > 0) {
          const response = await shopify.scopes.request(missing);
          if (response.result === 'granted-all') {
            console.log('All scopes granted');
          } else {
            console.warn('Some scopes declined:', response);
          }
        }
      } catch (err) {
        console.error('Scope check failed:', err);
      }
    })();
  </script>

  <!-- Install helper (only outside admin) -->
  <script>
    if (!location.search.includes('embedded=1')) {
      const shop = prompt('Enter your shop (e.g. mystore.myshopify.com):');
      if (shop) {
        location = `https://${shop}/admin/oauth/authorize?` + new URLSearchParams({
          client_id: 'ef270783ca1996cfb7dad3912f8355a6',
          scope: 'read_products,write_products,read_metaobject_definitions,write_metaobject_definitions,read_metaobjects,write_metaobjects,read_product_feeds,write_product_feeds',
          redirect_uri: location.href.split('?')[0],
          state: 'static'
        });
      }
    }
  </script>
</body>
</html>
