<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Dynamic Shopify Products – GitHub Pages + Cloudflare Proxy</title>
  <style>
    body { font-family: Arial, sans-serif; margin: 20px; }
    button { padding: 10px 16px; font-size: 16px; cursor: pointer; }
    .product { border: 1px solid #ddd; margin: 12px 0; padding: 12px; border-radius: 8px; }
    .product img { max-width: 180px; margin-top: 8px; }
    .error { color: red; }
    .loading { color: #555; }
  </style>
</head>
<body>

  <h1>Products from This Store</h1>
  <button onclick="loadProducts()">Load Products</button>
  <div id="output"></div>

  <script>
    // ——— CONFIG (Use GitHub Secrets) ———
    const PROXY_URL = 'https://shopify-proxy-romeoasis.meoasis2014.workers.dev';
    const API_VERSION = '2025-10';
    const CLIENT_ID = '%%SHOPIFY_API_KEY%%';         // Your App's API Key
    const CLIENT_SECRET = '%%SHOPIFY_PROXY_SECRET%%'; // Your App's Secret Key
    // ——————————————————————————————————

    // Get shop from URL (Shopify adds ?shop=... in embedded apps)
    function getShopFromUrl() {
      const params = new URLSearchParams(location.search);
      const shop = params.get('shop');
      return shop ? `https://${shop}` : null;
    }

    // Exchange code for access token using your Client ID & Secret
    async function getAccessToken(shop, code) {
      const tokenUrl = `${shop}/admin/oauth/access_token`;
      const response = await fetch(tokenUrl, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          client_id: CLIENT_ID,
          client_secret: CLIENT_SECRET,
          code: code
        })
      });

      if (!response.ok) throw new Error('Token exchange failed');
      const data = await response.json();
      return data.access_token;
    }

    // Initiate OAuth if no code is present
    function startOAuth(shop) {
      const redirectUri = encodeURIComponent(location.href.split('?')[0]);
      const oauthUrl = `${shop}/admin/oauth/authorize?client_id=${CLIENT_ID}&scope=read_products&redirect_uri=${redirectUri}`;
      location.href = oauthUrl;
    }

    async function loadProducts() {
      const output = document.getElementById('output');
      output.innerHTML = '<p class="loading">Loading...</p>';

      try {
        const shop = getShopFromUrl();
        if (!shop) throw new Error('No shop found in URL');

        const params = new URLSearchParams(location.search);
        const code = params.get('code');

        let token;
        if (!code) {
          startOAuth(shop);
          return;
        } else {
          token = await getAccessToken(shop, code);
        }

        // Call proxy with shop + token
        const apiPath = `/admin/api/${API_VERSION}/products.json?limit=10`;
        const proxyUrl = `${PROXY_URL}${apiPath}&shop=${encodeURIComponent(shop)}&token=${token}`;

        const res = await fetch(proxyUrl);
        if (!res.ok) throw new Error(`Proxy error: ${res.status}`);

        const { products } = await res.json();
        if (!products || products.length === 0) {
          output.innerHTML = '<p>No products found.</p>';
          return;
        }

        output.innerHTML = `<h2>${products.length} Products</h2>`;
        products.forEach(p => {
          const div = document.createElement('div');
          div.className = 'product';
          div.innerHTML = `
            <h3>${p.title}</h3>
            <p><strong>ID:</strong> ${p.id} | <strong>Handle:</strong> ${p.handle}</p>
            <p><strong>Price:</strong> $${p.variants[0]?.price || 'N/A'}</p>
            ${p.images[0]?.src ? `<img src="${p.images[0].src}" alt="${p.title}" onerror="this.style.display='none'">` : ''}
          `;
          output.appendChild(div);
        });

      } catch (err) {
        output.innerHTML = `<p class="error">Error: ${err.message}</p>`;
        console.error(err);
      }
    }

    // Auto-run when shop is in URL
    if (getShopFromUrl()) {
      loadProducts();
    }
  </script>
</body>
</html>
