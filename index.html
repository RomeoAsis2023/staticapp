<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Products – /products.json</title>
  <script src="https://cdn.shopify.com/s/assets/external/app.js"></script>
  <style>
    body {font-family: -apple-system, sans-serif; background: #f9f9f9; padding: 2rem; margin: 0;}
    .box {max-width: 900px; margin: auto; background: #fff; padding: 2rem; border-radius: 12px; box-shadow: 0 4px 16px rgba(0,0,0,.1);}
    h1 {color: #1a0dab; text-align: center; margin: 0 0 1rem;}
    .info {background: #e3f2fd; padding: 1rem; border-radius: 8px; text-align: center; margin-bottom: 1rem;}
    .grid {display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 20px; margin-top: 20px;}
    .card {border: 1px solid #eee; border-radius: 12px; overflow: hidden; background: #fff; box-shadow: 0 2px 8px rgba(0,0,0,.1);}
    .card img {width: 100%; height: 180px; object-fit: cover;}
    .card h3 {margin: 0; font-size: 16px; padding: 12px 12px 4px; font-weight: 600;}
    .card p {margin: 0; padding: 0 12px 12px; color: #008060; font-weight: bold;}
    .loading {text-align: center; padding: 20px; color: #777; font-weight: bold;}
    .error {text-align: center; padding: 20px; color: #c00; font-weight: bold;}
  </style>
</head>
<body>
  <div class="box">
    <h1>Shopify Products</h1>
    <div class="info">Store: <strong id="store">Detecting…</strong></div>
    <div id="status" class="loading hidden">Loading from /products.json…</div>
    <div id="error" class="error hidden"></div>
    <div id="grid" class="grid"></div>
  </div>

  <script>
    // === 1. Get shop from URL ===
    const params = new URLSearchParams(location.search);
    const shop = params.get('shop');
    const origin = shop ? `https://${shop.replace(/^https?:\/\//, '')}` : null;

    if (!origin) {
      document.getElementById('store').textContent = 'Error';
      document.getElementById('error').innerHTML = 'Open from Shopify admin.';
      throw new Error('No ?shop=');
    }

    // === 2. Init App Bridge (only to get ShopifyApp.shop) ===
    ShopifyApp.init({
      apiKey: "ef270783ca1996cfb7dad3912f8355a6",
      shopOrigin: origin,
      forceRedirect: true
    });

    // === 3. Update store name ===
    document.getElementById('store').textContent = ShopifyApp.shop;

    // === 4. Load /products.json via CORS proxy ===
    const PRODUCTS_URL = `https://${ShopifyApp.shop}/products.json`;
    const PROXY = 'https://api.allorigins.win/fetch?url=';

    async function loadProducts() {
      const status = document.getElementById('status');
      const errorEl = document.getElementById('error');
      const grid = document.getElementById('grid');

      status.classList.remove('hidden');
      errorEl.classList.add('hidden');
      grid.innerHTML = '';

      try {
        const response = await fetch(PROXY + encodeURIComponent(PRODUCTS_URL));
        if (!response.ok) throw new Error(`HTTP ${response.status}`);

        const data = await response.json();
        const products = data.products || [];

        if (!products.length) {
          grid.innerHTML = '<p>No products found.</p>';
          return;
        }

        grid.innerHTML = products.map(p => `
          <div class="card">
            <img src="${p.images[0]?.src || 'https://via.placeholder.com/200'}" alt="${p.title}" loading="lazy">
            <h3>${p.title}</h3>
            <p>$${p.variants[0].price}</p>
          </div>
        `).join('');

      } catch (err) {
        errorEl.textContent = `Error: ${err.message}`;
        errorEl.classList.remove('hidden');
      } finally {
        status.classList.add('hidden');
      }
    }

    // === 5. AUTO LOAD ===
    ShopifyApp.ready(() => {
      loadProducts();
    });
  </script>
</body>
</html>
