<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>StaticAppTest - Shopify Admin API Test</title>

  <!-- REQUIRED: App Bridge (loads shopify global) -->
  <script src="https://cdn.shopify.com/shopifycloud/app-bridge.js"></script>

  <!-- OPTIONAL: Polaris UI -->
  <script src="https://cdn.shopify.com/shopifycloud/polaris.js"></script>

  <!-- REQUIRED: Your public API key -->
  <meta name="shopify-api-key" content="ef270783ca1996cfb7dad3912f8355a6" />
</head>

<body>
  <div style="padding: 2rem;">
    <button id="open-picker" class="Polaris-Button Polaris-Button--primary">
      Open resource picker
    </button>
    <pre id="output" style="margin-top:1rem; background:#f6f8fa; padding:1rem; border-radius:6px; font-size:0.9rem;"></pre>
  </div>

  <script>
    // Wait for Shopify to inject `shopify` (happens automatically in embedded admin)
    const waitForShopify = setInterval(() => {
      if (window.shopify && typeof window.shopify.resourcePicker === 'function') {
        clearInterval(waitForShopify);
        initPicker();
      }
    }, 50);

    function initPicker() {
      document.getElementById('open-picker').addEventListener('click', async () => {
        try {
          const selected = await shopify.resourcePicker({ type: 'product' });
          document.getElementById('output').textContent = JSON.stringify(selected, null, 2);
        } catch (err) {
          document.getElementById('output').textContent = 'Error: ' + err.message;
        }
      });
    }
  </script>
</body>
</html>
