<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Shop Origin + Products</title>
  <script src="https://cdn.shopify.com/s/assets/external/app.js"></script>
  <style>
    body{font-family:system-ui,sans-serif;background:#f6f6f6;padding:2rem;}
    .box{background:#fff;padding:1.5rem;border-radius:8px;box-shadow:0 2px 8px rgba(0,0,0,.1);max-width:600px;margin:auto;}
    code{background:#eee;padding:2px 6px;border-radius:4px;}
    .product {border:1px solid #ddd;padding:10px;margin:10px 0;border-radius:6px;display:flex;align-items:center;}
    .product img {max-height:60px;margin-right:10px;border-radius:4px;}
    .loading {color:#777;text-align:center;margin:20px 0;}
    .error {color:#c00;text-align:center;margin:20px 0;}
  </style>
</head>
<body>
  <div class="box" id="output">Loading…</div>

  <script>
    const params = new URLSearchParams(location.search);
    const shop = params.get('shop');
    const origin = shop ? (shop.startsWith('http') ? shop : `https://${shop}`) : null;
    
    if (!origin) {
      document.getElementById('output').innerHTML = '<p style="color:red;">Open from Shopify admin.</p>';
      throw new Error('No shop parameter');
    }

    ShopifyApp.init({
      apiKey: "ef270783ca1996cfb7dad3912f8355a6",
      shopOrigin: origin,
      forceRedirect: true
    });

    // === YOUR WORKING CODE ===
    document.getElementById('output').innerHTML = `
      <p><strong>Shop origin:</strong> <code>${origin}</code></p>
      <p class="loading">App Bridge ready – loading products from <code>/products.json</code>…</p>
    `;

    // === Fetch /products.json ===
    async function loadProducts() {
      const PRODUCTS_URL = `${origin}/products.json`;
      const PROXY_URL = `https://api.allorigins.win/fetch?url=${encodeURIComponent(PRODUCTS_URL)}`;

      try {
        const response = await fetch(PROXY_URL);
        if (!response.ok) throw new Error(`Proxy error: ${response.status}`);

        const proxyData = await response.json();
        if (!proxyData.contents) throw new Error('No content returned');

        const jsonData = JSON.parse(proxyData.contents);
        const products = jsonData.products || [];

        const output = document.getElementById('output');
        if (!products.length) {
          output.innerHTML += '<p class="error">No products found (publish some in Admin).</p>';
          return;
        }

        output.innerHTML += `
          <p><strong>Found ${products.length} products!</strong></p>
          ${products.slice(0, 10).map(p => `
            <div class="product">
              ${p.images[0] ? `<img src="${p.images[0].src}" alt="${p.title}">` : '[No Image]'}
              <strong>${p.title}</strong> - $${p.variants[0]?.price || 'N/A'}
            </div>
          `).join('')}
          ${products.length > 10 ? `<p><em>... and ${products.length - 10} more</em></p>` : ''}
        `;

      } catch (error) {
        const output = document.getElementById('output');
        output.innerHTML += `<p class="error">Error: ${error.message}</p>`;
        console.error('Full error:', error);  // Check browser console for details
      }
    }

    // === AUTO LOAD ===
    ShopifyApp.ready(() => {
      loadProducts();
    });
  </script>
</body>
</html>
