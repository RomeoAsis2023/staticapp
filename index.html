<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Static App – Products</title>
  <style>
    body {font-family:Arial,sans-serif;margin:20px;}
    button{padding:10px 16px;font-size:16px;cursor:pointer;margin:5px;}
    .product{border:1px solid #ddd;margin:12px 0;padding:12px;border-radius:8px;}
    .product img{max-width:180px;margin-top:8px;}
    .error{color:red;font-weight:bold;}
    .loading{color:#555;}
    .info{color:#0066cc;margin-top:15px;}
  </style>
  <script src="https://cdn.shopify.com/s/assets/external/app.js"></script>
</head>
<body>

  <h1>Products from this store</h1>
  <button id="loadBtn">Load Products</button>
  <button id="manualBtn" style="display:none;">Enter Code Manually</button>
  <div id="output"></div>

  <script>
    const PROXY_URL      = 'https://shopify-proxy-romeoasis.meoasis2014.workers.dev';
    const API_VERSION    = '2025-10';
    const CLIENT_ID      = 'ef270783ca1996cfb7dad3912f8355a6';
    const CLIENT_SECRET  = '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';
    const REDIRECT_URI   = 'https://romeoasis2023.github.io/staticapp/';

    const output = document.getElementById('output');
    const btn    = document.getElementById('loadBtn');
    const manualBtn = document.getElementById('manualBtn');

    function getShop() {
      const shop = new URLSearchParams(location.search).get('shop');
      return shop ? `https://${shop}` : null;
    }

    function startOAuth(shop) {
      const url = `${shop}/admin/oauth/authorize?client_id=${CLIENT_ID}&scope=read_products&redirect_uri=${encodeURIComponent(REDIRECT_URI)}&state=staticapp`;
      
      // Try top-level redirect first
      try {
        window.top.location.href = url;
        return;
      } catch (e) {}

      // Fallback: open in new tab
      const win = window.open(url, '_blank');
      if (win) {
        output.innerHTML = '<p class="info">OAuth opened in new tab. Approve, then return here and click "Load Products" again.</p>';
        manualBtn.style.display = 'inline-block';
      } else {
        output.innerHTML = '<p class="error">Popup blocked. Please allow popups or use manual mode.</p>';
        manualBtn.style.display = 'inline-block';
      }
    }

    async function exchangeCode(shop, code) {
      const tokenUrl = `${PROXY_URL}/token`;
      const res = await fetch(tokenUrl, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ shop, code, client_id: CLIENT_ID, client_secret: CLIENT_SECRET })
      });
      if (!res.ok) {
        const txt = await res.text();
        throw new Error(`Token failed: ${txt}`);
      }
      return (await res.json()).access_token;
    }

    async function loadProductsWithToken(token, shop) {
      const proxyUrl = `${PROXY_URL}/admin/api/${API_VERSION}/products.json?limit=10&shop=${encodeURIComponent(shop)}&token=${token}`;
      const res = await fetch(proxyUrl);
      if (!res.ok) throw new Error(`Proxy error: ${await res.text()}`);

      const { products } = await res.json();
      if (!products?.length) {
        output.innerHTML = '<p>No products found.</p>';
        return;
      }

      output.innerHTML = `<h2>${products.length} Products</h2>`;
      products.forEach(p => {
        const div = document.createElement('div');
        div.className = 'product';
        div.innerHTML = `
          <h3>${p.title}</h3>
          <p>ID: ${p.id} | Handle: ${p.handle}</p>
          <p>Price: $${p.variants[0]?.price || 'N/A'}</p>
          ${p.images[0]?.src ? `<img src="${p.images[0].src}" onerror="this.style.display='none'">` : ''}
        `;
        output.appendChild(div);
      });
    }

    async function loadProducts() {
      output.innerHTML = '';
      btn.disabled = true;
      manualBtn.style.display = 'none';

      const shop = getShop();
      if (shop) {
        const code = new URLSearchParams(location.search).get('code');
        if (code) {
          output.innerHTML = '<p class="loading">Exchanging token...</p>';
          try {
            const token = await exchangeCode(shop, code);
            await loadProductsWithToken(token, shop);
          } catch (err) {
            output.innerHTML = `<p class="error">${err.message}</p>`;
          }
        } else {
          startOAuth(shop);
        }
      } else {
        output.innerHTML = '<p class="error">Open from Shopify Admin.</p>';
      }

      btn.disabled = false;
    }

    manualBtn.onclick = () => {
      const code = prompt('Paste the "code" from the OAuth URL:');
      if (code) {
        const shop = getShop();
        if (shop) {
          exchangeCode(shop, code).then(token => loadProductsWithToken(token, shop)).catch(err => {
            output.innerHTML = `<p class="error">Manual token failed: ${err.message}</p>`;
          });
        }
      }
    };

    btn.onclick = loadProducts;
    if (getShop()) loadProducts();
  </script>
</body>
</html>
