<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>StaticAppTest - Shopify Admin API Test</title>
  <meta name="shopify-api-key" content="ef270783ca1996cfb7dad3912f8355a6" />
  <script src="https://cdn.shopify.com/shopifycloud/app-bridge.js"></script>
  <script src="https://cdn.shopify.com/shopifycloud/polaris.js"></script>
</head>
<body>
  <button id="open-picker">Open resource picker</button>
  <script>
    document.getElementById('open-picker').addEventListener('click', async () => {
      const selected = await shopify.resourcePicker({type: 'product'});
      console.log(selected);
    });
  </script>

  <!-- ==== AUTO-INSTALL WITH FULL SCOPES (runs only once) ==== -->
  <script>
    (function() {
      const params = new URLSearchParams(location.search);
      if (params.has('shop') && !params.has('code')) {
        // Already installed? Do nothing.
        return;
      }
      if (!params.has('shop')) {
        // Not in admin → show install prompt
        const shop = prompt('Enter your shop (e.g. mystore.myshopify.com):');
        if (!shop) return;
        const scopes = 'read_metaobject_definitions,write_metaobject_definitions,' +
                       'read_metaobjects,write_metaobjects,' +
                       'read_product_feeds,write_product_feeds,' +
                       'read_products,write_products';
        const redirectUri = location.href.split('?')[0];
        const authUrl = `https://${shop}/admin/oauth/authorize?` + new URLSearchParams({
          client_id: 'ef270783ca1996cfb7dad3912f8355a6',
          scope: scopes,
          redirect_uri: redirectUri,
          state: 'static-app',
          grant_options: []
        });
        location.href = authUrl;
      }
    })();
  </script>
</body>
</html>
