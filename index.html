<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Shopify Products – Auto Detect</title>
  <style>
    body {font-family:system-ui,sans-serif;background:#f9f9f9;padding:2rem;margin:0;}
    .container {max-width:900px;margin:auto;background:#fff;padding:2rem;border-radius:12px;box-shadow:0 4px 16px rgba(0,0,0,.1);}
    h1 {color:#1a0dab;text-align:center;margin-top:0;}
    .grid {display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:20px;margin-top:20px;}
    .card {border:1px solid #eee;border-radius:12px;overflow:hidden;background:#fff;box-shadow:0 2px 8px rgba(0,0,0,.1);}
    .card img {width:100%;height:180px;object-fit:cover;}
    .card h3 {margin:0;font-size:16px;padding:12px 12px 4px;font-weight:600;}
    .card p {margin:0;padding:0 12px 12px;color:#008060;font-weight:bold;}
    .loading,.error {text-align:center;padding:20px;font-weight:bold;}
    .loading {color:#777;}
    .error {color:#c00;}
    .info {background:#e3f2fd;padding:15px;border-radius:8px;margin-bottom:20px;text-align:center;}
  </style>
</head>
<body>
  <div class="container">
    <div class="info">
      <strong>Store:</strong> <span id="store">Detecting…</span>
    </div>
    <div id="status" class="loading hidden">Loading products…</div>
    <div id="error" class="error hidden"></div>
    <div id="grid" class="grid"></div>
  </div>

  <script>
    // === 1. Get store from URL parameter (set by bookmarklet) ===
    const params = new URLSearchParams(location.search);
    const store = params.get('store');
    const storeEl = document.getElementById('store');

    if (!store) {
      storeEl.textContent = 'Not on a Shopify store';
      document.getElementById('error').innerHTML = '<p>Open this from a Shopify store using the bookmarklet.</p>';
      throw new Error('No store parameter');
    }

    storeEl.textContent = store;
    document.title = `Products – ${store}`;

    // === 2. Load products via /products.json + CORS proxy ===
    const PROXY = 'https://api.allorigins.win/fetch?url=';
    const url = `https://${store}/products.json`;

    async function loadProducts() {
      const status = document.getElementById('status');
      const errorEl = document.getElementById('error');
      const grid = document.getElementById('grid');

      status.classList.remove('hidden');
      errorEl.classList.add('hidden');
      grid.innerHTML = '';

      try {
        const response = await fetch(PROXY + encodeURIComponent(url));
        if (!response.ok) throw new Error(`HTTP ${response.status}`);

        const data = await response.json();
        const products = data.products || [];

        if (!products.length) {
          grid.innerHTML = '<p>No products found.</p>';
          return;
        }

        grid.innerHTML = products.map(p => `
          <div class="card">
            <img src="${p.images[0]?.src || 'https://via.placeholder.com/200'}" 
                 alt="${p.title}" loading="lazy">
            <h3>${p.title}</h3>
            <p>$${p.variants[0].price}</p>
          </div>
        `).join('');

      } catch (err) {
        errorEl.textContent = `Error: ${err.message}`;
        errorEl.classList.remove('hidden');
      } finally {
        status.classList.add('hidden');
      }
    }

    // === 3. Auto-load ===
    loadProducts();
  </script>
</body>
</html>
