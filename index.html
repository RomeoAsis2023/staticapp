<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>StaticAppTest - Shopify Admin API Test</title>
  <meta name="shopify-api-key" content="ef270783ca1996cfb7dad3912f8355a6" />
  <script src="https://cdn.shopify.com/shopifycloud/app-bridge.js"></script>
  <script src="https://cdn.shopify.com/shopifycloud/polaris.js"></script>
</head>
<body>
  

<button id="fetchProductsBtn">Request Scopes & Fetch Products</button>
<div id="results"></div>

  <script>
    document.getElementById('fetchProductsBtn').addEventListener('click', async () => {
  try {
    const resultsDiv = document.getElementById('results');
    resultsDiv.innerHTML = 'Processing...';

    // 1. Request the required scopes
    const scopeResponse = await shopify.scopes.request(['read_products', 'write_discounts']);
    console.log('Scope request response:', scopeResponse);
    
    // 2. Fetch products after scopes are granted
    const products = await shopify.rest.Product.all({
      session: session, // Make sure you have session available
      limit: 10
    });
    
    console.log('Products:', products);
    
    // 3. Display results
    resultsDiv.innerHTML = `
      <h3>Success!</h3>
      <p>Found ${products.data.length} products</p>
      <ul>
        ${products.data.map(product => `<li>${product.title}</li>`).join('')}
      </ul>
    `;
    
  } catch (error) {
    console.error('Error:', error);
    document.getElementById('results').innerHTML = `
      <p style="color: red;">Error: ${error.message}</p>
    `;
  }
});
  </script>
</body>
</html>
