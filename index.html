<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Custom Shopify App</title>
</head>
<body>
    <h1>Welcome to my Custom Shopify App</h1>

    <script>
        const clientId = 'ef270783ca1996cfb7dad3912f8355a6'; // Replace with your actual Client ID
        const clientSecret = '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'; // Replace with your actual Client Secret
        const proxyUrl = 'https://shopify-proxy-romeoasis.meoasis2014.workers.dev/';

        function handleInstallation() {
            const shopDomain = new URLSearchParams(window.location.search).get('shop');
            // Redirecting to the Shopify OAuth page
            window.location.href = `https://${shopDomain}/admin/oauth/authorize?client_id=${clientId}&scope=read_metaobject_definitions,write_metaobject_definitions,read_metaobjects,write_metaobjects,read_product_feeds,write_product_feeds,read_products,write_products&redirect_uri=${encodeURIComponent(window.location.origin + '/callback')}`;
        }

        function handleLoad() {
            if (!localStorage.getItem('accessToken')) {
                handleInstallation();
            } else {
                fetchProducts();
            }
        }

        function fetchProducts() {
            const accessToken = localStorage.getItem('accessToken');
            const shopDomain = localStorage.getItem('shopDomain');
            fetch(`${proxyUrl}?shop=https://${shopDomain}&token=${accessToken}`, {
                method: 'GET',
                headers: {
                    'Content-Type': 'application/json',
                },
            })
            .then(response => response.json())
            .then(data => {
                console.log(data);
                // Display or manipulate product data as needed
            })
            .catch(error => {
                console.error('Error:', error);
            });
        }

        function handleCallback() {
            const urlParams = new URLSearchParams(window.location.search);
            const code = urlParams.get('code');
            const shopDomain = urlParams.get('shop');

            if (code && shopDomain) {
                fetch(`https://${shopDomain}/admin/oauth/access_token`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({
                        client_id: clientId,
                        client_secret: clientSecret,
                        code: code,
                    }),
                })
                .then(response => response.json())
                .then(data => {
                    localStorage.setItem('accessToken', data.access_token);
                    localStorage.setItem('shopDomain', shopDomain);
                    window.location.href = window.location.origin; // Redirect to the main page
                })
                .catch(error => {
                    console.error('Error:', error);
                });
            }
        }

        if (window.location.pathname === '/callback') {
            handleCallback();
        } else {
            handleLoad();
        }
    </script>
</body>
</html>
