<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>StaticAppTest - Shopify Admin API Test</title>
  <meta name="shopify-api-key" content="ef270783ca1996cfb7dad3912f8355a6" />
  <script src="https://cdn.shopify.com/shopifycloud/app-bridge.js"></script>
  <script src="https://cdn.shopify.com/shopifycloud/polaris.js"></script>
</head>
<body>
  <button id="open-picker">Open resource picker</button>

  <script>
    document.getElementById('open-picker').addEventListener('click', async () => {
      const selected = await shopify.resourcePicker({type: 'product'});
      console.log(selected);
    });
  </script>

  <!-- ONLY RUNS IF NOT INSIDE ADMIN (install helper) -->
  <script>
    // Only run if NOT embedded (no ?embedded=1 or missing shop/host)
    if (!location.search.includes('embedded=1') && !location.search.includes('shop=')) {
      const shop = prompt('Enter your shop domain (e.g. mystore.myshopify.com):');
      if (shop) {
        const scopes = 'read_metaobject_definitions,write_metaobject_definitions,read_metaobjects,write_metaobjects,read_product_feeds,write_product_feeds,read_products,write_products';
        const url = `https://${shop}/admin/oauth/authorize?` + new URLSearchParams({
          client_id: 'ef270783ca1996cfb7dad3912f8355a6',
          scope: scopes,
          redirect_uri: location.href.split('?')[0],
          state: 'static'
        });
        location = url;
      }
    }
  </script>
</body>
</html>
